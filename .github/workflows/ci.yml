name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]     # Raspberry Pi OS 12 (bookworm) / 13 (trixie)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -r app/requirements.txt pytest
      - name: Syntax
        run: python -m py_compile app/*.py device/*.py system/sysedit.py boot/make_frames.py
      - name: Tests
        run: python -m pytest -q

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # feste Version (nicht die vom Ubuntu-Image) – lokal genauso prüfbar: pip install shellcheck-py==0.10.0.1
      - name: Install shellcheck
        run: pip install shellcheck-py==0.10.0.1
      - name: shellcheck
        run: shellcheck install.sh device/kiosk.sh device/screen_schedule.sh system/raspy-update system/raspy-display-setup
